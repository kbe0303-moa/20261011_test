<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b50">
  <title>오늘의 청소당번</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: #203d32;
      background: #f4f6f0;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 32px 20px;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at top, #e0eddf, transparent 65%);
    }
    main { width: min(100%, 760px); }
    .eyebrow {
      margin: 0 0 14px;
      color: #426651;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
    }
    h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 44px);
      letter-spacing: -.05em;
    }
    .intro {
      margin: 14px 0 28px;
      color: #53695e;
      line-height: 1.8;
    }
    .panel {
      padding: 32px;
      border: 1px solid #dce5d9;
      border-radius: 26px;
      background: #fffefa;
      box-shadow: 0 16px 48px #203d320a;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    h2 { margin: 0; font-size: 18px; }
    .badge {
      padding: 7px 11px;
      border-radius: 99px;
      background: #eaf2e8;
      color: #376045;
      font-size: 12px;
      white-space: nowrap;
    }
    .hint {
      margin: 12px 0 24px;
      color: #637168;
      font-size: 14px;
      line-height: 1.6;
    }
    .results {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .number-card {
      min-height: 132px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px dashed #cdd9c9;
      border-radius: 18px;
      background: #f6f8f2;
    }
    .number {
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .label { color: #657465; font-size: 12px; }
    .selected {
      border: 1px solid #b7d0ae;
      background: #edf5e7;
      animation: appear .35s ease both;
    }
    .selected .number { color: #176b50; }
    .status {
      min-height: 24px;
      margin: 24px 0 20px;
      color: #4b6254;
      text-align: center;
      line-height: 1.6;
    }
    button {
      width: 100%;
      min-height: 56px;
      padding: 14px 20px;
      border: 0;
      border-radius: 14px;
      background: #176b50;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    button:hover { background: #11543e; }
    button:active { transform: translateY(1px); }
    button:focus-visible {
      outline: 3px solid #c68121;
      outline-offset: 4px;
    }
    .note {
      margin: 20px 0 0;
      color: #637168;
      font-size: 13px;
      text-align: center;
      line-height: 1.8;
    }
    footer {
      margin-top: 22px;
      color: #617160;
      font-size: 13px;
      text-align: center;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 540px) {
      body { padding: 24px 16px; }
      .panel { padding: 24px 16px; border-radius: 22px; }
      .results { gap: 6px; }
      .number-card { min-height: 96px; border-radius: 12px; }
      .label { font-size: 11px; }
      .status { font-size: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">우리 반 · 함께 만드는 깨끗한 교실</p>
      <h1>오늘의 청소당번</h1>
      <p class="intro">
        작은 손길이 모여, 교실이 반짝!<br>
        학생 번호 1~30 중 오늘 함께할 5명을 뽑아보세요.
      </p>
    </header>

    <section class="panel" aria-labelledby="result-title">
      <div class="panel-head">
        <h2 id="result-title">오늘의 다섯 주인공</h2>
        <span class="badge">30명 중 5명</span>
      </div>

      <p class="hint">한 번의 추첨에서 같은 번호는 나오지 않아요.</p>

      <ul class="results" id="results" aria-label="청소당번 추첨 결과">
        <li class="number-card">
          <span class="number">?</span><span class="label">대기 중</span>
        </li>
        <li class="number-card">
          <span class="number">?</span><span class="label">대기 중</span>
        </li>
        <li class="number-card">
          <span class="number">?</span><span class="label">대기 중</span>
        </li>
        <li class="number-card">
          <span class="number">?</span><span class="label">대기 중</span>
        </li>
        <li class="number-card">
          <span class="number">?</span><span class="label">대기 중</span>
        </li>
      </ul>

      <p class="status" id="status"
         role="status" aria-live="polite" aria-atomic="true">
        준비되면 아래 버튼을 눌러주세요.
      </p>

      <button id="draw-button" type="button">청소당번 추첨하기</button>

      <p class="note">
        결과는 번호순으로 표시됩니다.<br>
        다시 추첨하면 전체 30명 중 새로 뽑아요.
      </p>

      <noscript>
        <p>추첨하려면 브라우저에서 JavaScript를 활성화해주세요.</p>
      </noscript>
    </section>

    <footer>함께 정리하고, 기분 좋게 하루 마무리하기.</footer>
  </main>

  <script>
    const results = document.getElementById("results");
    const status = document.getElementById("status");
    const drawButton = document.getElementById("draw-button");
    let drawCount = 0;

    // Fisher–Yates 방식으로 섞어 중복 없는 5명을 선택합니다.
    function pickStudents() {
      const students = Array.from({ length: 30 }, (_, i) => i + 1);

      for (let i = students.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [students[i], students[j]] = [students[j], students[i]];
      }

      return students.slice(0, 5).sort((a, b) => a - b);
    }

    drawButton.addEventListener("click", () => {
      const selected = pickStudents();
      drawCount++;
      results.replaceChildren();

      selected.forEach((number, index) => {
        const card = document.createElement("li");
        card.className = "number-card selected";
        card.style.animationDelay = `${index * 50}ms`;
        card.innerHTML = `
          <span class="number">
            ${number}<span class="sr-only">번</span>
          </span>
          <span class="label">청소당번</span>
        `;
        results.appendChild(card);
      });

      status.textContent =
        `${drawCount}회 추첨 완료! ${selected.join("번, ")}번이 선정됐어요.`;

      drawButton.textContent = "다시 추첨하기";
    });
  </script>
</body>
</html>
